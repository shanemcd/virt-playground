# Static hostPath volumes on the CRC node.
# TopoLVM only has ~15Gi free on the rhel VG, so this lab uses hostPath for the
# Windows ISO (~7.6Gi) and 40Gi root disk.
#
# Paths below match the live virt-test fixture on this cluster (ISO was staged
# from an explicit on-node path; do NOT hard-require CRC shared home/Downloads —
# see README "Windows ISO source"). Adjust hostPath.path before apply if your
# STAGE_ROOT differs.
#
# Prepare on the node before apply:
#   mkdir -p $STAGE_ROOT/{win-iso,win2025-root}
#   ln $WINDOWS_ISO $STAGE_ROOT/win-iso/disk.img   # or noprompt-patched copy
#   truncate -s 40G $STAGE_ROOT/win2025-root/disk.img
#   chown -R 107:107 $STAGE_ROOT/win2025-root
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: virt-test-win2025-iso
  labels:
    app: windows-ga-fixture
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  hostPath:
    path: /var/home/shanemcd/virt-test-disks/win-iso
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: virt-test-win2025-root
  labels:
    app: windows-ga-fixture
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  hostPath:
    path: /var/home/shanemcd/virt-test-disks/win2025-root
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: win2025-iso
  namespace: virt-test
  labels:
    app: windows-ga-fixture
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
  volumeName: virt-test-win2025-iso
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: win2025-rootdisk
  namespace: virt-test
  labels:
    app: windows-ga-fixture
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  resources:
    requests:
      storage: 40Gi
  volumeName: virt-test-win2025-root
