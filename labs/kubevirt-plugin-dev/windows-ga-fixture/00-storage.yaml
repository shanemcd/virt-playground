# Static hostPath volumes on the CRC node local disk.
# TopoLVM VG free space is too small for ISO+40Gi root; stage under
# /var/lib/virt-test-disks on rhel-root. See README for upload/backup.
#
# Prepare on the node before apply:
#   mkdir -p /var/lib/virt-test-disks/{win-iso,win2025-root}
#   ln $WINDOWS_ISO /var/lib/virt-test-disks/win-iso/disk.img  # or noprompt copy
#   truncate -s 40G /var/lib/virt-test-disks/win2025-root/disk.img
#   chown -R 107:107 /var/lib/virt-test-disks/win2025-root
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: virt-test-win2025-iso
  labels:
    app: windows-ga-fixture
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  hostPath:
    path: /var/lib/virt-test-disks/win-iso
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: virt-test-win2025-root
  labels:
    app: windows-ga-fixture
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  hostPath:
    path: /var/lib/virt-test-disks/win2025-root
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: win2025-iso
  namespace: virt-test
  labels:
    app: windows-ga-fixture
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
  volumeName: virt-test-win2025-iso
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: win2025-rootdisk
  namespace: virt-test
  labels:
    app: windows-ga-fixture
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath-manual
  volumeMode: Filesystem
  resources:
    requests:
      storage: 40Gi
  volumeName: virt-test-win2025-root
